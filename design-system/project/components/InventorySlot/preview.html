<!-- @dsCard group="HUD" height=260 subtitle="Five slots: two weapons, three flexible items" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>
<div class="or-stack" style="align-items:center;background:linear-gradient(160deg,var(--surface-raised),var(--background) 70%)">
  <div class="or-inventory">
    <button class="or-slot"><span class="or-keycap or-keycap--sm or-slot__key">1</span><span class="or-slot__weapon-mark"></span><span data-icon="rifle" data-cls="or-slot__icon"></span></button>
    <button class="or-slot is-selected"><span class="or-keycap or-keycap--sm or-slot__key">2</span><span class="or-slot__weapon-mark"></span><span data-icon="shotgun" data-cls="or-slot__icon"></span></button>
    <span class="or-inventory__sep"></span>
    <button class="or-slot"><span class="or-keycap or-keycap--sm or-slot__key">3</span><span data-icon="grapple" data-cls="or-slot__icon"></span><span class="or-slot__charge"><i style="width:60%"></i></span></button>
    <button class="or-slot or-slot--shield is-full"><span class="or-keycap or-keycap--sm or-slot__key">4</span><span data-icon="shield" data-cls="or-slot__icon"></span><span class="or-slot__qty">3</span></button>
    <button class="or-slot is-empty"><span class="or-keycap or-keycap--sm or-slot__key">5</span></button>
  </div>
  <div class="or-slot-label">SG-4 Breaker<small>Shield Pack 3/3 · full</small></div>
</div>
<script>
document.querySelectorAll('[data-icon]').forEach(function (el) { el.outerHTML = Orbit.icon(el.dataset.icon, el.dataset.cls); });
</script>
</body>
</html>
