name: Game

# Runs the headless checks and exports the web build on every push that
# touches the game. Pushes to main also publish the build to GitHub Pages.

on:
  push:
    paths: ["game/**", ".github/workflows/game.yml"]
  pull_request:
    paths: ["game/**", ".github/workflows/game.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and the web export template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-web-nothreads

      - name: Install Godot and the web export template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # The full template bundle is about 1.3 GB; keep only the single-threaded web template.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -j -q /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$dest"
          rm /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      - name: Run movement checks
        run: |
          set -o pipefail
          ~/godot/godot --headless --path game -s res://tests/movement_test.gd 2>&1 | tee test.log
          grep -q "ALL PASSED" test.log
          if grep -q "SCRIPT ERROR" test.log; then echo "Script errors in the test run"; exit 1; fi

      - name: Export web build
        run: |
          mkdir -p game/build/web
          ~/godot/godot --headless --path game --export-release "Web" build/web/index.html
          test -f game/build/web/index.wasm && test -f game/build/web/index.pck
          ls -la game/build/web
          echo "### Web build" >> "$GITHUB_STEP_SUMMARY"
          du -h game/build/web/* | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          gzip -9 -c game/build/web/index.wasm | wc -c | awk '{printf "    index.wasm gzipped: %.1f MB\n", $1/1048576}' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-and-export
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
